name: Compact Home Cards
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make home cards compact on phones
        run: |
          cat >> src/style.css <<'EOF'

          @media(max-width:720px){
            .command-grid{grid-template-columns:1fr 1fr;gap:8px}
            .command-card,.hero-command{min-height:132px;height:132px;padding:16px;border-radius:15px}
            .command-copy h2{font-size:22px;margin:3px 0}
            .command-card>b{right:14px;top:13px;font-size:15px}
            .command-icon{right:14px;bottom:13px;width:40px;height:40px;font-size:18px}
            .pour-icon{width:48px;height:48px;font-size:23px}
          }
          @media(max-width:360px){
            .command-grid{gap:7px}
            .command-card,.hero-command{min-height:116px;height:116px;padding:13px;border-radius:14px}
            .command-copy h2{font-size:19px}
            .command-card>b{right:11px;top:10px;font-size:14px}
            .command-icon{right:11px;bottom:10px;width:34px;height:34px;font-size:15px}
            .pour-icon{width:40px;height:40px;font-size:19px}
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/style.css
          git commit -m "Make home cards compact on phones"
          git push
      - name: Remove temporary workflow
        run: |
          rm .github/workflows/compact-home.yml
          git add .github/workflows/compact-home.yml
          git commit -m "Remove temporary compact card workflow"
          git push

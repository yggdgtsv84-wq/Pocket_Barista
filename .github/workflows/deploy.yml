name: Deploy Pocket Barista

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply AeroPress and V60 Switch options
        run: python scripts/add_brewer_options.py
      - name: Validate generated JavaScript
        run: |
          set +e
          node --check src/main.js 2> /tmp/js-error.txt
          status=$?
          if [ "$status" -ne 0 ]; then
            cat /tmp/js-error.txt
            cp /tmp/js-error.txt JS_SYNTAX_ERROR.txt
            git config user.name "Pocket Barista Bot"
            git config user.email "actions@github.com"
            git add JS_SYNTAX_ERROR.txt
            git commit -m "Capture generated JS syntax error" || true
            git push || true
            exit "$status"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Deploy Pocket Barista

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair guided brew warnings
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/main.js')
          s=p.read_text()
          replacements = [
            ("state.guide={r:scaledRecipe(base,scale),elapsed:0,step:0,running:false};renderGuide()",
             "state.guide={r:scaledRecipe(base,scale),elapsed:0,step:0,running:false,warnedStep:false};renderGuide()"),
            ("releaseWakeLock();g.elapsed=0;g.step=0;g.running=false;renderGuide()",
             "releaseWakeLock();g.elapsed=0;g.step=0;g.running=false;g.warnedStep=false;renderGuide()"),
            ("function tickGuide(){const g=state.guide;if(!g||!g.running)return;g.elapsed=Number.isFinite(g.elapsed)?g.elapsed+0.1:0.1;const s=g.r.steps[g.step];const end=Number(s?.[1])||0;if(g.elapsed>=end)advanceGuide(false);else updateGuideClock()}",
             "function tickGuide(){const g=state.guide;if(!g||!g.running)return;g.elapsed=Number.isFinite(g.elapsed)?g.elapsed+0.1:0.1;const s=g.r.steps[g.step];const end=Number(s?.[1])||0;const remaining=end-g.elapsed;if(end>=7&&remaining<=7&&remaining>0&&!g.warnedStep){g.warnedStep=true;beep()}if(g.elapsed>=end)advanceGuide(false);else updateGuideClock()}") ,
            ("g.step=next;if(manual){const priorEnd=Number(g.r.steps[g.step]?.[1])||0;g.elapsed=Math.max(g.elapsed,priorEnd)}notify(`Next: ${g.r.steps[next][0]}`);renderGuide()}",
             "g.step=next;g.warnedStep=false;if(manual){const priorEnd=Number(g.r.steps[g.step]?.[1])||0;g.elapsed=Math.max(g.elapsed,priorEnd);notify(`Next: ${g.r.steps[next][0]}`)}else toast(`Next: ${g.r.steps[next][0]}`);renderGuide()}")
          ]
          for old,new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected timer pattern not found: {old[:100]}')
              s=s.replace(old,new,1)
          p.write_text(s)
          print('Guided brew warning patch applied: 7-second pre-step beep; espresso shot timer untouched.')
          PY
      - name: Repair AeroPress recipe markup
        run: sed -i 's/data-method-brew="${kind}"/data-method-brew="${kind}" data-method="${kind}"/' src/main.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

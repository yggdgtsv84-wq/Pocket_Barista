name: Deploy Pocket Barista

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect guide timer
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('src/main.js').read_text()
          for needle in ['function beep','beep()','g.step','g.interval','guideToggle']:
              print(f'--- {needle} ---')
              pos=0
              for _ in range(8):
                  i=s.find(needle,pos)
                  if i<0: break
                  print(f'@ {i}: {s[max(0,i-500):i+900]}')
                  pos=i+len(needle)
          PY
      - name: Repair AeroPress recipe markup
        run: sed -i 's/data-method-brew="${kind}"/data-method-brew="${kind}" data-method="${kind}"/' src/main.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Deploy Pocket Barista

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure My Recipes library
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/main.js')
          s=p.read_text()
          replacements = [
            ('<span>My coffee book</span>', '<span>My Recipes</span>'),
            ('Save to coffee book', 'Save to My Recipes'),
            ('Your private coffee book', 'Your private recipes'),
            ('<p>Save a curated method or custom brew.</p>', '<p>Create and save your own recipes here.</p>'),
            ("toast('Recipe saved ✓')", "toast('Recipe saved to My Recipes ✓')"),
            ("state.recipes=data||[];render()", "state.recipes=(data||[]).filter(r=>!String(r.notes||'').startsWith('Inspired by '));render()"),
            ("async function saveBuilt(id){if(!state.user)return openAuth();const r=R.find(x=>x.id===id);if(!r)return;const {error}=await supabase.from('recipes').insert({user_id:state.user.id,name:r.name,method:r.method,coffee_g:r.coffee_g,water_g:r.water_g,ratio:r.ratio,grind:r.grind,temperature_c:r.temperature_c,brew_seconds:r.brew_seconds,notes:`Inspired by ${r.creator}. ${r.notes}`,rating:0});if(error)return toast(error.message);toast('Added to your coffee book ✓');await loadRecipes()}", "function saveBuilt(id){const r=R.find(x=>x.id===id);if(!r)return;if(!state.user)return openAuth();useBuilt(r);toast('Recipe loaded as a starting point — save your version to My Recipes.')}")
          ]
          for old,new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected pattern not found: {old[:100]}')
              s=s.replace(old,new,1)
          p.write_text(s)
          print('My Recipes configured: custom saves only; curated recipes are excluded from the personal library.')
          PY
      - name: Repair guided brew warnings
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/main.js')
          s=p.read_text()
          replacements = [
            ("state.guide={r:scaledRecipe(base,scale),elapsed:0,step:0,running:false};renderGuide()",
             "state.guide={r:scaledRecipe(base,scale),elapsed:0,step:0,running:false,warnedStep:false};renderGuide()"),
            ("releaseWakeLock();g.elapsed=0;g.step=0;g.running=false;renderGuide()",
             "releaseWakeLock();g.elapsed=0;g.step=0;g.running=false;g.warnedStep=false;renderGuide()"),
            ("function tickGuide(){const g=state.guide;if(!g||!g.running)return;g.elapsed=Number.isFinite(g.elapsed)?g.elapsed+0.1:0.1;const s=g.r.steps[g.step];const end=Number(s?.[1])||0;if(g.elapsed>=end)advanceGuide(false);else updateGuideClock()}",
             "function tickGuide(){const g=state.guide;if(!g||!g.running)return;g.elapsed=Number.isFinite(g.elapsed)?g.elapsed+0.1:0.1;const s=g.r.steps[g.step];const end=Number(s?.[1])||0;const remaining=end-g.elapsed;if(end>=7&&remaining<=7&&remaining>0&&!g.warnedStep){g.warnedStep=true;beep()}if(g.elapsed>=end)advanceGuide(false);else updateGuideClock()}") ,
            ("g.step=next;if(manual){const priorEnd=Number(g.r.steps[g.step]?.[1])||0;g.elapsed=Math.max(g.elapsed,priorEnd)}notify(`Next: ${g.r.steps[next][0]}`);renderGuide()}",
             "g.step=next;g.warnedStep=false;if(manual){const priorEnd=Number(g.r.steps[g.step]?.[1])||0;g.elapsed=Math.max(g.elapsed,priorEnd);notify(`Next: ${g.r.steps[next][0]}`)}else toast(`Next: ${g.r.steps[next][0]}`);renderGuide()}")
          ]
          for old,new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected timer pattern not found: {old[:100]}')
              s=s.replace(old,new,1)
          p.write_text(s)
          print('Guided brew warning patch applied: 7-second pre-step beep; espresso shot timer untouched.')
          PY
      - name: Repair AeroPress recipe markup
        run: sed -i 's/data-method-brew="${kind}"/data-method-brew="${kind}" data-method="${kind}"/' src/main.js
      - name: Add AeroPress and V60 Switch to hamburger menu
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/main.js')
          s=p.read_text()
          old='<button class="drawer-item" data-menu-page="espresso"><b>03</b><span>Espresso shot timer</span><i>→</i></button><div class="drawer-label">LIBRARY</div><button class="drawer-item" id="drawerSaved"><b>04</b><span>My Recipes</span><i>→</i></button>'
          new='<button class="drawer-item" data-menu-page="espresso"><b>03</b><span>Espresso shot timer</span><i>→</i></button><button class="drawer-item" data-menu-page="aero"><b>04</b><span>AeroPress</span><i>→</i></button><button class="drawer-item" data-menu-page="switch"><b>05</b><span>V60 Switch</span><i>→</i></button><div class="drawer-label">LIBRARY</div><button class="drawer-item" id="drawerSaved"><b>06</b><span>My Recipes</span><i>→</i></button>'
          if old not in s:
              raise SystemExit('Expected hamburger menu pattern not found')
          p.write_text(s.replace(old,new,1))
          print('Hamburger menu updated: AeroPress and V60 Switch added.')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

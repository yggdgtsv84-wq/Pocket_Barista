name: Fix AeroPress brew handler

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-aeropress-brew.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch AeroPress handler
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/main.js')
          s = p.read_text()
          old = """function bindMethodCards(){
           document.querySelectorAll('[data-method-brew]').forEach(btn=>btn.addEventListener('click',e=>{
            e.preventDefault();
            e.stopPropagation();
            const card=btn.closest('[data-recipe-card]');
            const scale=Number(card?.querySelector('.method-scale input')?.value||1);
            startMethodRecipe(btn.dataset.method,btn.dataset.recipeId,scale);
           }));
          }"""
          new = """function bindMethodCards(){
           document.querySelectorAll('[data-method-brew]').forEach(btn=>{
            if(btn.dataset.method==='aero')return;
            btn.addEventListener('click',e=>{
             e.preventDefault();
             e.stopPropagation();
             const card=btn.closest('[data-recipe-card]');
             const scale=Number(card?.querySelector('.method-scale input')?.value||1);
             startMethodRecipe(btn.dataset.method,btn.dataset.recipeId,scale);
            });
           });
          }
          document.addEventListener('click',e=>{
           const btn=e.target.closest('[data-method-brew][data-method="aero"]');
           if(!btn)return;
           e.preventDefault();
           e.stopImmediatePropagation();
           const card=btn.closest('[data-recipe-card]');
           const scale=Number(card?.querySelector('.method-scale input')?.value||1);
           startMethodRecipe('aero',btn.dataset.recipeId,scale);
          },true);"""
          if old not in s:
              raise SystemExit('Expected AeroPress handler block was not found; aborting without changes.')
          p.write_text(s.replace(old,new,1))
          PY

      - name: Verify patch
        run: |
          grep -n "data-method-brew.*data-method=\\\"aero\\\"" src/main.js || true
          npm install
          npm run build

      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js .github/workflows/fix-aeropress-brew.yml
          git commit -m "Fix AeroPress brew click handling"
          git rm .github/workflows/fix-aeropress-brew.yml
          git commit -m "Remove one-shot AeroPress fix workflow"
          git push

name: Fix AeroPress method controls
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/method-fix.js'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch method page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main.js')
          s=p.read_text()
          old='''function methodPage(kind,title,eyebrow,intro,recipes){return `'''
          start=s.index(old)
          end=s.index('\nfunction ', start+1)
          new=r'''function methodPage(kind,title,eyebrow,intro,recipes){return `<section class="page-head"><button class="back-btn" data-page="home">← Dashboard</button><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${intro}</p></section><section class="recipe-deck">${recipes.map((r,i)=>`<article class="recipe-panel" data-recipe-card="${r.id}"><div class="recipe-index">${String(i+1).padStart(2,'0')}</div><div class="recipe-main"><div class="recipe-line"><span class="recipe-badge">${esc(r.badge)}</span><span>${esc(r.creator)}</span></div><h2>${esc(r.name)}</h2><p>${esc(r.notes)}</p><div class="specs"><span><b data-method-coffee="${r.id}">${r.coffee_g}g</b> coffee</span><span><b data-method-water="${r.id}">${r.water_g}g</b> water</span><span><b>1:${r.ratio}</b> ratio</span><span><b>${r.temperature_c}°</b> water</span><span><b>${fmt(r.brew_seconds)}</b> target</span></div><div class="recipe-scale"><div class="recipe-scale-head"><span>BREW SIZE</span><strong data-method-scale-value="${r.id}">1.00×</strong></div><input class="recipe-scale-slider" data-method-scale="${r.id}" type="range" min="0.50" max="1.50" step="0.05" value="1" aria-label="Adjust coffee and water volume"></div><div class="recipe-buttons"><button type="button" class="primary" data-method-brew="${kind}" data-recipe-id="${r.id}">Brew</button>${r.sourceUrl?`<a class="source-link" href="${r.sourceUrl}" target="_blank" rel="noreferrer">Source ↗</a>`:''}</div></div></article>`).join('')}</section>`}'''
          s=s[:start]+new+s[end:]
          old2='''function bindMethodCards(){\n document.querySelectorAll('[data-method-brew]').forEach(btn=>btn.addEventListener('click',()=>startMethodRecipe(btn.dataset.method,btn.dataset.recipeId)));\n}'''
          new2=r'''function bindMethodCards(){
 document.querySelectorAll('[data-method-brew]').forEach(btn=>btn.addEventListener('click',e=>{
  e.preventDefault();
  e.stopPropagation();
  const card=btn.closest('[data-recipe-card]');
  const scale=Number(card?.querySelector('[data-method-scale]')?.value||1);
  startMethodRecipe(btn.dataset.method,btn.dataset.recipeId,scale);
 }));
 document.querySelectorAll('[data-method-scale]').forEach(sl=>sl.addEventListener('input',()=>{
  const id=sl.dataset.methodScale;
  const r=(A.find(x=>x.id===id)||S.find(x=>x.id===id));
  if(!r)return;
  const scale=Number(sl.value)||1;
  const card=sl.closest('[data-recipe-card]');
  const value=card?.querySelector('[data-method-scale-value]');
  const coffee=card?.querySelector('[data-method-coffee]');
  const water=card?.querySelector('[data-method-water]');
  if(value)value.textContent=scale.toFixed(2)+'×';
  if(coffee)coffee.textContent=roundBrew(r.coffee_g*scale)+'g';
  if(water)water.textContent=roundBrew(r.water_g*scale)+'g';
 }));
}'''
          s=s.replace(old2,new2)
          old3='''function startMethodRecipe(kind,id){\n const r=(kind==='aero'?A:S).find(x=>x.id===id);if(!r)return;\n state.guide={r,step:0,elapsed:0,running:false};renderGuide();\n}'''
          new3=r'''function startMethodRecipe(kind,id,scale=1){
 const base=(kind==='aero'?A:S).find(x=>x.id===id);if(!base)return;
 stopGuide();
 state.guide={r:scaledRecipe(base,scale),step:0,elapsed:0,running:false};renderGuide();
}'''
          s=s.replace(old3,new3)
          marker='''document.addEventListener("click", e => {\n  const btn=e.target.closest("[data-method-brew]");\n  if(!btn)return;\n  e.preventDefault();\n  e.stopImmediatePropagation();\n  startMethodRecipe(btn.dataset.method,btn.dataset.recipeId);\n}, true);'''
          s=s.replace(marker,'')
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.js
          git commit -m 'Fix AeroPress brew controls and size scale' || exit 0
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/fix-aeropress.yml
          git add .github/workflows/fix-aeropress.yml
          git commit -m 'Remove temporary AeroPress fix workflow' || true
          git push || true

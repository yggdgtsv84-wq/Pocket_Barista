name: Fix method brew controls
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix method brew buttons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main.js')
          s=p.read_text()
          s=s.replace('<button class="primary" data-method-brew=', '<button type="button" class="primary" data-method-brew=')
          marker='document.addEventListener("click", e => {\n  const btn=e.target.closest("[data-method-brew]");\n  if(!btn)return;\n  e.preventDefault();\n  e.stopImmediatePropagation();\n  startMethodRecipe(btn.dataset.method,btn.dataset.recipeId);\n}, true);'
          if marker not in s:
              s += '\n\n' + marker + '\n'
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js
          git commit -m "Fix AeroPress and V60 Switch brew buttons" || true
          git rm .github/workflows/fix-method-brew.yml
          git commit -m "Remove temporary brew fix workflow" || true
          git push
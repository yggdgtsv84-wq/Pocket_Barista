name: Fix method brew button

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch method brew handler
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/main.js')
          text = path.read_text()
          old = """function bindMethodCards(){\n document.querySelectorAll('[data-method-brew]').forEach(btn=>btn.addEventListener('click',()=>startMethodRecipe(btn.dataset.method,btn.dataset.recipeId)));\n}\nfunction startMethodRecipe(kind,id){\n const r=(kind==='aero'?A:S).find(x=>x.id===id);if(!r)return;\n state.guide={r,step:0,elapsed:0,running:false};\n renderGuide();\n}"""
          new = """function bindMethodCards(){\n document.querySelectorAll('[data-method-brew]').forEach(btn=>btn.addEventListener('click',e=>{\n  e.preventDefault();\n  e.stopPropagation();\n  const card=btn.closest('[data-recipe-card]');\n  const scale=Number(card?.querySelector('.method-scale input')?.value||1);\n  startMethodRecipe(btn.dataset.method,btn.dataset.recipeId,scale);\n }));\n}\nfunction startMethodRecipe(kind,id,scale=1){\n const base=(kind==='aero'?A:S).find(x=>x.id===id);if(!base)return;\n stopGuide();\n state.guide={r:scaledRecipe(base,scale),step:0,elapsed:0,running:false};\n renderGuide();\n}"""
          if old not in text:
              raise SystemExit('Expected method brew handler was not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js .github/workflows/fix-method-brew.yml
          git rm .github/workflows/fix-method-brew.yml
          git commit -m "Fix AeroPress and Switch brew buttons"
          git push

      - name: Trigger Pages deployment
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main'
            })

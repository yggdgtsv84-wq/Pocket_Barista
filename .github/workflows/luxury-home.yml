name: Luxury Home Refinement

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refine:
    if: "!startsWith(github.event.head_commit.message, 'Luxury home:')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply quiet luxury visual system
        run: |
          cat >> src/style.css <<'CSS'

/* Quiet luxury home — black, espresso, ivory, champagne */
:root{--black:#050403;--ink:#090807;--panel:#0d0c0a;--panel2:#12100d;--copper:#b88a57;--copper-hi:#e1c08c;--copper-dim:#624a31;--white:#f4efe7;--muted:#8e857b;--line:rgba(225,192,140,.18);--hair:rgba(244,239,231,.07)}
body{background:radial-gradient(900px 500px at 50% -180px,rgba(184,138,87,.10),transparent 65%),#050403}
.app-shell{background:transparent}
.topbar{background:rgba(5,4,3,.82);backdrop-filter:blur(22px);border-bottom:1px solid rgba(225,192,140,.10)}
.dashboard-home{max-width:1100px;min-height:calc(100vh - 150px);display:flex;flex-direction:column;justify-content:center;padding:clamp(36px,7vh,86px) 0 120px}
.dashboard-hero{max-width:760px;margin:0 auto clamp(38px,7vh,72px);text-align:center;align-items:center}
.dashboard-hero .eyebrow{color:var(--copper-hi);letter-spacing:.24em}
.dashboard-hero h1{font-size:clamp(46px,8vw,88px);line-height:.9;letter-spacing:-.065em;margin:16px 0 22px;color:var(--white)}
.dashboard-hero h1 em{font-family:'Playfair Display',serif;font-style:italic;font-weight:600;color:#e6d8c4}
.dashboard-hero p{max-width:520px;margin:0 auto 24px;color:#9b9186;font-size:15px;line-height:1.65}
.status-chip{border-color:rgba(225,192,140,.18);background:rgba(225,192,140,.045);color:#b7a58f;box-shadow:inset 0 1px rgba(255,255,255,.03)}
.status-chip i{background:#caa16b;box-shadow:0 0 12px rgba(202,161,107,.65)}
.method-grid{grid-template-columns:1fr 1fr;gap:18px;width:100%}
.method-card{min-height:340px;border-radius:30px;border:1px solid rgba(225,192,140,.14);background:linear-gradient(145deg,rgba(23,20,17,.96),rgba(8,7,6,.98));box-shadow:inset 0 1px rgba(255,255,255,.045),0 28px 80px rgba(0,0,0,.32);padding:30px}
.method-card:before{content:'';position:absolute;inset:1px;border-radius:29px;background:linear-gradient(135deg,rgba(255,255,255,.035),transparent 35%,rgba(225,192,140,.035));pointer-events:none}
.method-card:hover{transform:translateY(-5px);border-color:rgba(225,192,140,.38);box-shadow:inset 0 1px rgba(255,255,255,.06),0 30px 90px rgba(0,0,0,.52)}
.method-pour{background:radial-gradient(circle at 85% 12%,rgba(184,138,87,.15),transparent 32%),linear-gradient(145deg,#171310,#080706)}
.method-number{color:#c6a77c}
.method-symbol{font-size:110px;right:28px;top:18px;color:rgba(225,192,140,.055);filter:blur(.1px)}
.method-copy{left:30px;right:30px;bottom:30px}
.method-copy>span{color:#c9a875;letter-spacing:.22em}
.method-copy h2{font-size:clamp(31px,4vw,45px);font-weight:600;color:#f4eee5;margin:9px 0 10px}
.method-copy p{color:#91887e;font-size:13px;max-width:390px}
.method-arrow{width:46px;height:46px;right:28px;bottom:27px;border-color:rgba(225,192,140,.18);background:rgba(225,192,140,.035);color:#d5b47f;transition:.25s ease}
.method-card:hover .method-arrow{background:#b88a57;color:#080604;border-color:#b88a57;transform:translate(2px,-2px)}
.method-espresso{background:linear-gradient(145deg,#12100e,#070605)}
.dashboard-strip{margin-top:18px;border-top:1px solid rgba(244,239,231,.065);color:#6f675f;padding:15px 2px;font-size:8px;letter-spacing:.20em}
@media(max-width:720px){.dashboard-home{min-height:auto;padding:34px 0 110px}.dashboard-hero{margin-bottom:32px}.dashboard-hero h1{font-size:clamp(44px,13vw,64px)}.dashboard-hero p{font-size:14px}.method-grid{grid-template-columns:1fr;gap:12px}.method-card{min-height:235px;border-radius:24px;padding:22px}.method-card:before{border-radius:23px}.method-symbol{font-size:78px;right:20px;top:16px}.method-copy{left:22px;right:22px;bottom:22px}.method-copy h2{font-size:31px}.method-copy p{font-size:12px;max-width:280px}.method-arrow{right:20px;bottom:20px;width:40px;height:40px}.dashboard-strip{justify-content:center}.dashboard-strip span:first-child,.dashboard-strip span:nth-child(2){display:none}}
CSS
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/style.css
          git rm .github/workflows/luxury-home.yml
          git commit -m "Luxury home: quiet black and champagne system"
          git push
name: Refine Home Dashboard

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refine:
    if: !startsWith(github.event.head_commit.message, 'Refine home dashboard:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make dashboard the launchpad
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main.js')
          s = p.read_text()
          start = s.index('function homePage(){')
          end = s.index('\n\nfunction pourPage', start)
          new = '''function homePage(){return `<section class="dashboard-home">
 <div class="dashboard-hero">
  <div class="eyebrow">POCKET BARISTA / HOME</div>
  <h1>Your coffee<br><em>control centre.</em></h1>
  <p>Choose how you want to brew. Your next move is always one tap away.</p>
  <div class="status-chip"><i></i> READY TO BREW</div>
 </div>
 <div class="method-grid">
  <button class="method-card method-pour" data-page="pour">
   <div class="method-number">01</div>
   <div class="method-symbol">◒</div>
   <div class="method-copy"><span>METHOD 01</span><h2>Pour Over</h2><p>Guided recipes, live step countdowns and scale targets.</p></div>
   <div class="method-arrow">↗</div>
  </button>
  <button class="method-card method-espresso" data-page="espresso">
   <div class="method-number">02</div>
   <div class="method-symbol">◉</div>
   <div class="method-copy"><span>METHOD 02</span><h2>Espresso Shot Timer</h2><p>Precision timing with dose, yield and brew-ratio tracking.</p></div>
   <div class="method-arrow">↗</div>
  </button>
 </div>
 <div class="dashboard-strip"><span>SELECT A METHOD</span><span>POUR OVER · ESPRESSO</span><span>PB / 01</span></div>
 </section>`}
'''
          p.write_text(s[:start] + new + s[end:])
          PY
      - name: Commit dashboard update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js
          git diff --cached --quiet && exit 0
          git commit -m "Refine home dashboard: method launchpad"
          git push

name: Remove method capture handler

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove competing capture listener
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/main.js')
          s = p.read_text()
          block = '''\n\ndocument.addEventListener("click", e => {\n  const btn=e.target.closest("[data-method-brew]");\n  if(!btn)return;\n  e.preventDefault();\n  e.stopImmediatePropagation();\n  startMethodRecipe(btn.dataset.method,btn.dataset.recipeId);\n}, true);'''
          if block not in s:
              raise SystemExit('Expected capture listener block was not found; refusing to modify the file.')
          p.write_text(s.replace(block, '\n'))
          PY
      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.js .github/workflows/remove-method-capture.yml
          git rm .github/workflows/remove-method-capture.yml
          git commit -m 'Remove competing method brew capture handler'
          git push

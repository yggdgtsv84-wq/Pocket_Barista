name: Style Home Dashboard

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  style:
    if: !startsWith(github.event.head_commit.message, 'Style home dashboard:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add dashboard styles
        run: |
          cat >> src/style.css <<'CSS'

/* Home dashboard launchpad */
.dashboard-home{max-width:1180px;margin:0 auto;padding:clamp(30px,6vw,72px) 0 110px}
.dashboard-hero{display:flex;flex-direction:column;align-items:flex-start;max-width:760px;margin-bottom:clamp(28px,5vw,52px)}
.dashboard-hero h1{font-size:clamp(42px,7vw,78px);line-height:.95;letter-spacing:-.055em;margin:12px 0 18px}
.dashboard-hero h1 em{font-family:'Playfair Display',serif;font-weight:600}
.dashboard-hero p{max-width:600px;font-size:clamp(16px,2vw,20px);color:var(--muted);line-height:1.55;margin:0 0 22px}
.method-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;width:100%}
.method-card{position:relative;min-height:290px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#11100f,#070707);color:var(--white);text-align:left;padding:28px;overflow:hidden;cursor:pointer;transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease}
.method-card:hover{transform:translateY(-4px);border-color:rgba(240,165,104,.5);box-shadow:0 22px 60px rgba(0,0,0,.45)}
.method-card:active{transform:translateY(-1px)}
.method-pour{background:radial-gradient(circle at 85% 15%,rgba(200,121,61,.2),transparent 35%),linear-gradient(145deg,#15110e,#070707)}
.method-number{font:500 11px 'DM Mono',monospace;letter-spacing:.16em;color:var(--copper-hi)}
.method-symbol{position:absolute;right:28px;top:20px;font-size:90px;line-height:1;color:rgba(240,165,104,.1);font-weight:400}
.method-copy{position:absolute;left:28px;right:28px;bottom:30px}
.method-copy>span{font:500 10px 'DM Mono',monospace;letter-spacing:.18em;color:var(--copper)}
.method-copy h2{font-size:clamp(28px,4vw,42px);letter-spacing:-.035em;margin:8px 0 8px}
.method-copy p{max-width:430px;color:var(--muted);line-height:1.45;margin:0;font-size:14px}
.method-arrow{position:absolute;right:26px;bottom:25px;width:42px;height:42px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;color:var(--copper-hi);font-size:20px}
.dashboard-strip{display:flex;justify-content:space-between;gap:20px;margin-top:16px;padding:13px 2px;font:500 9px 'DM Mono',monospace;letter-spacing:.15em;color:var(--muted);border-top:1px solid var(--hair)}
@media(max-width:720px){.dashboard-home{padding-top:28px}.method-grid{grid-template-columns:1fr}.method-card{min-height:245px;padding:22px}.method-copy{left:22px;right:22px;bottom:22px}.method-symbol{right:20px;top:18px;font-size:72px}.dashboard-strip{font-size:8px}.dashboard-strip span:nth-child(2){display:none}}
CSS
      - name: Commit dashboard styles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/style.css
          git diff --cached --quiet && exit 0
          git commit -m "Style home dashboard: method launch cards"
          git push

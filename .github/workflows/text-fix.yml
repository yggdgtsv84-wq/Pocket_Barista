name: Text fix
on:
  push:
    paths: ['.github/workflows/text-fix.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace label
        run: python - <<'PY'
          from pathlib import Path
          p=Path('src/main.js')
          s=p.read_text()
          old='Brew guided'
          new='Brew'
          if old not in s:
              raise SystemExit('label not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.js
          git commit -m 'Rename guided brew button to Brew'
          git push
